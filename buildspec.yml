version: 0.2

env:
  variables:
    IMAGE_REPO_NAME: "secure-container-app"
    IMAGE_TAG: "latest"
    AWS_DEFAULT_REGION: "ap-south-1"

phases:

  install:
    runtime-versions:
      docker: 20
    commands:
      - echo "Installing Trivy"
      - apt-get update
      - apt-get install -y wget curl unzip
      - wget https://github.com/aquasecurity/trivy/releases/latest/download/trivy_0.51.1_Linux-64bit.deb
      - dpkg -i trivy_0.51.1_Linux-64bit.deb

  pre_build:
    commands:
      - echo "Logging into Amazon ECR"
      - aws --version

      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

      - ECR_URI=$ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$IMAGE_REPO_NAME

      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

  build:
    commands:

      - echo "Building Docker Image"

      - docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .

      - docker tag $IMAGE_REPO_NAME:$IMAGE_TAG $ECR_URI:$IMAGE_TAG

      - echo "Running Trivy Security Scan"

      - trivy image --severity HIGH,CRITICAL --exit-code 1 $IMAGE_REPO_NAME:$IMAGE_TAG

  post_build:
    commands:

      - echo "Security Scan Passed"

      - echo "Pushing Docker Image to ECR"

      - docker push $ECR_URI:$IMAGE_TAG

      - echo "Build Completed Successfully"

artifacts:
  files:
    - '**/*'